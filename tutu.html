<!DOCTYPE html> 
<html> 
<head> 
<title>Image Gallery</title> 
 
<style> 
body {
        background-image: url("pii.jpg");
        background-color: #E0F7FA;
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        font-family: "Trebuchet MS", sans-serif;
        color: #0B4F6C;
        margin: 0;
        padding: 20px;
        
    }

     h1 {
        color:  #065A60; 
        background-color:#F6E8CE; 
        border: 8px dotted #1ECDCB;  
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(11, 79, 108, 0.25);
        padding: 15px 25px;
        font-size: 28px;
        max-width: 550px;
        margin: 20px auto 0 auto;
        text-align: center;
    }
 
.gallery-container {
     display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;                
    gap: 30px;               
    margin: 50px auto;
    max-width: 1400px;
    padding: 25px;
    background-color: rgba(246, 232, 206, 0.85); 
    border: 5px dotted #269B4B;     
    box-shadow: 0 15px 35px rgba(6, 90, 96, 0.2);
}
.gallery-container:hover img:not(:hover) {
    filter: brightness(85%);
    opacity: 0.8;
}
img { 
  width: 280px; 
    height: 280px; 
    object-fit: cover;            
    border: 6px solid #1ECDCB;    
    border-radius: 20px;
    box-shadow: 0 15px 30px rgba(24, 139, 211, 0.35); 
    position: relative; 
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
    box-shadow 0.4s, 
    border-color 0.4s,
    filter 0.3s,
    opacity 0.3s;
    z-index: 1;
    cursor: pointer;
} 
img:hover {
    border-color: #E8A838;          
    box-shadow: 0 25px 45px rgba(232, 168, 56, 0.55);
    }
 .card {
    background-color: #FFFDF7;     
    border: 5px solid #1ECDCB;   
    border-radius: 20px;
    width: 280px;
    padding: 15px;
    box-shadow: 0 15px 30px rgba(24, 139, 211, 0.25);
    transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                box-shadow 0.35s, 
                border-color 0.35s,
                filter 0.3s,
                opacity 0.3s;
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    text-align: center;
}

.card:hover {
    transform: scale(1.08);
    z-index: 10;
    border-color: #E8A838;
    box-shadow: 0 25px 45px rgba(232, 168, 56, 0.45);
}

.card img { 
    width: 100%; 
    height: 230px; 
    object-fit: cover;
    border-radius: 14px;
    border-bottom: 4px solid #269B4B;
} 

.card h2 {
    color: #065A60;  
    font-size: 20px;
    margin: 14px 0 4px 0;
}


.card .location {
    font-size: 13px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
}


.card p {
    color: #3A5A6B;
    font-size: 14px;
    line-height: 1.5;
    margin: 0;
}

 @media (max-width: 700px) {
    .card {
        width: 100%;
        max-width: 340px;
    }
}

</style> 
 
</head>
